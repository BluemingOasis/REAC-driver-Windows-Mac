name: Build REAC Driver

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
# Windows 빌드 (필요한 DLL 파일들을 함께 패키징하도록 수정)
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Components with g++
        run: |
          # 1. Player 빌드
          g++ -std=c++17 -DNOMINMAX -DWIN32_LEAN_AND_MEAN -Isrc src\main.cpp src\pcap_capture.cpp src\reac_decoder.cpp src\waveout_player.cpp -lwinmm -o reac_play.exe
          
          # 2. Settings GUI 빌드
          g++ -std=c++17 -DNOMINMAX -DWIN32_LEAN_AND_MEAN -mwindows -Isrc src\config_app.cpp src\pcap_capture.cpp src\reac_settings.cpp src\waveout_player.cpp -ladvapi32 -lwinmm -o reac_config.exe
          
          # 3. Reaper ASIO Driver 프로토타입 빌드
          g++ -std=c++17 -DNOMINMAX -DWIN32_LEAN_AND_MEAN -Isrc -shared src\reac_asio_driver.cpp src\pcap_capture.cpp src\reac_decoder.cpp src\reac_ring_buffer.cpp src\waveout_player.cpp src\reac_settings.cpp -lole32 -ladvapi32 -luuid -lwinmm -o reac_asio.dll

          # 4. 실행에 필요한 MinGW 시스템 DLL 파일들을 현재 폴더로 자동 복사
          cp C:/mingw64/bin/libwinpthread-1.dll .
          cp C:/mingw64/bin/libstdc++-6.dll .
          cp C:/mingw64/bin/libgcc_s_seh-1.dll .

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reac-driver-windows
          path: |
            reac_play.exe
            reac_config.exe
            reac_asio.dll
            libwinpthread-1.dll
            libstdc++-6.dll
            libgcc_s_seh-1.dll

  # macOS 빌드 (리포지토리 내부 쉘 스크립트 활용)
  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Grant execute permissions for scripts
        run: chmod +x scripts/*.sh

      # 1. macOS Probe 빌드
      - name: Build macOS Probe
        run: ./scripts/build_macos_probe.sh

      # 2. 로컬 코드 사이닝 인증서 생성 (CI 환경 특성상 키체인 접근 에러 방지를 위해 continue-on-error 적용)
      - name: Create Local Codesign Identity
        continue-on-error: true
        run: ./scripts/create_macos_local_codesign_identity.sh

      # 3. macOS Core Audio Driver 빌드
      - name: Build macOS Audio Driver
        run: ./scripts/build_macos_audio_driver.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reac-driver-macos
          path: build/
